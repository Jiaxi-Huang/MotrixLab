# Source-of-truth base values for the motrix.apg provider.
# Framework-neutral runtime settings live in the task recipe root.
# The recipe mirrors Uni-SuperMimic's SuperMimicConfig (shared learning rate
# with cosine decay to 3%, horizon-32 imagination, windowed world-model
# supervision, lambda-return critic on imagined rollouts, Gaussian action
# noise) at cartpole-sized network and batch widths; task recipes override.
defaults:
  # Load the shared structured ApgCfg schema registered by the Motrix provider.
  - _motrix_apg_schema
  # Apply the values in this file after the schema.
  - _self_
# Learning device such as cuda, cuda:0, or cpu; null selects CUDA when available, otherwise CPU.
device: null
# Discount for imagination returns, lambda-return targets, and bootstrapping.
gamma: 0.99
# Observation-group names the actor and critic consume.
policy_group: policy
value_group: value
collector:
  # Std of Gaussian exploration noise on collected commands, as a fraction of
  # the task action limit; deterministic evaluation never adds noise.
  # Upstream: action_noise.
  exploration_noise_std: 0.1
  exploration_clip: 1.0
replay:
  # Transition slots per environment lane; a short on-policy window as
  # upstream (buffer_steps), not a large off-policy ring.
  capacity: 1000
  # Policy steps collected before learning, including after checkpoint restore.
  warmup_steps: 128
world_model:
  learning_rate: 0.0002
  # Transitions per supervised window batch. Upstream: wm_batch.
  batch_size: 512
  # Window batches per training iteration. Upstream: wm_batches.
  batches_per_iteration: 10
  # Multi-step supervision window. Upstream: wm_window.
  window: 8
  hidden: [256, 256]
  max_grad_norm: 1.0
  # residual predicts the whole modeling state flat; floating_base predicts
  # the physical block and derives the rest through differentiable FK.
  scheme: residual
actor:
  # Policy-observation history stack (upstream ``hist``).
  history: 1
  output_activation: tanh
  learning_rate: 0.0002
  # Imagination start states per policy update. Upstream: pi_batch. Adam betas
  # (0.9, 0.95) are recipe constants applied by the learner.
  batch_size: 1024
  updates_per_iteration: 1
  hidden: [256, 256]
critic:
  learning_rate: 0.0002
  hidden: [256, 128]
  # Regression passes over the imagined rollout. Upstream: critic_epochs.
  epochs: 5
  # Upstream: critic_minibatches.
  minibatches: 4
  # Lambda-return mixing. Upstream: lam.
  lam: 0.95
  max_grad_norm: 1.0
imagination:
  # BPTT unroll length. Upstream: horizon.
  horizon: 32
  # The learner additionally clips actor gradient values to 0.1 (upstream
  # recipe constant).
  max_grad_norm: 1.0
trainer:
  iterations: 150
  # Reserved; eager execution only in this provider version.
  compile: false
  # Real environment steps collected per iteration and lane. Fractional
  # values carry their remainder across iterations (upstream 1/utd).
  collect_steps_per_iteration: 200.0
  # Learner MLP autocast dtype; null keeps fp32, "bf16" drops only the MLP
  # matmuls to bf16 (geometry/rewards/collection stay fp32).
  amp: null
  # WM-only iterations before policy updates start. Upstream: wm_only_iters.
  warmup_iterations: 5
  # Cosine lr decay horizon; null decays over `iterations` (to 3% of the
  # base rate). Upstream: lr_decay_iters.
  lr_decay_iterations: null
  # Deterministic real evaluation every N iterations; 0 disables.
  eval_interval: 10
  eval_steps: 2000
  # Trainer-owned end-of-training evaluation.
  final_eval: true
