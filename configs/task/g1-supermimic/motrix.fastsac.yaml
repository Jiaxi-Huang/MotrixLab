# @package _global_
# Task g1-supermimic: goal-conditioned LAFAN1 corpus tracking on Unitree G1 with
# Motrix FastSAC. Observation layout: 99-D proprioception plus the 10-frame
# future-reference goal (730-D); the value group adds the privileged reference
# and tracking-error terms. Resource scale follows the bundled WBT recipes; the
# full corpus needs the LAFAN1 corpus cache (scripts/motion/download_lafan.py --all).
defaults:
  - /algo_base@algo: motrix.fastsac
  - _self_
task:
  env: g1-supermimic
  rllib: motrix
  algo: fastsac
num_envs: 2048
play_num_envs: 16
seed: 1
checkpoint:
  interval: 1000
algo:
  agent:
    num_updates: 4
    policy_frequency: 2
    gamma: 0.99
    tau: 0.05
    target_entropy_ratio: -0.3
    num_atoms: 501
  trainer:
    num_learning_iterations: 60000
    async_options:
      # Keep the WBT training UTD fixed at four updates per ingested batch.
      utd_mode: strict
