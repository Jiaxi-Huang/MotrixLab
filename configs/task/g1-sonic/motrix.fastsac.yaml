# @package _global_
# MotrixSim manager-based SONIC G1 tracking with the SONIC FastSAC actor.
# Resource scale targets the bundled single-clip smoke store. Full-dataset
# training can restore the release encoder dims and a larger environment/batch
# configuration as a separate experiment.
defaults:
  - /algo_base@algo: motrix.fastsac
  - _self_
task:
  env: g1-sonic
  rllib: motrix
  algo: fastsac
num_envs: 2048
play_num_envs: 16
seed: 1
checkpoint:
  interval: 10000
algo:
  policy_variant: sonic
  variant:
    model:
      num_future_frames: 10 #10
      num_history_frames: 10 #10
      # encoder_index: false  # drop the trailing encoder mask from the packed
      # observation: every row routes through the g1 encoder and observation
      # normalization runs uniformly (no binary passthrough channels)
      num_tokens: 2 #2
      token_dim: 32 #32
      fsq_levels: 32 #32
      action_dim: 29
      g1_encoder_hidden_dims: [2048, 1024, 512, 512]
      smpl_encoder_hidden_dims: [2048, 1024, 512, 512]
      teleop_encoder_hidden_dims: [2048, 1024, 512, 512]
      g1_motion_decoder_hidden_dims: [2048, 1024, 512, 512]
    auxiliary:
      g1_recon: 0.01
      g1_smpl_latent: 1.0
      g1_teleop_latent: 1.0
      teleop_smpl_latent: 1.0
      reencoded_smpl_g1_latent: 1.0
  agent:
    obs_normalization: true
    actor_hidden_dim: 1024
    critic_hidden_dim: 1024
    num_updates: 4
    policy_frequency: 2
    gamma: 0.99
    tau: 0.05
    target_entropy_ratio: -0.3
    num_atoms: 501
    learning_starts: 100
    max_grad_norm: 1.0
    buffer_size: 2048
  trainer:
    num_learning_iterations: 500000
    async_options:
      utd_mode: strict
      num_collectors: 2
      num_learners: 2
      cpus_per_collector: 48
      ring_capacity: 128
