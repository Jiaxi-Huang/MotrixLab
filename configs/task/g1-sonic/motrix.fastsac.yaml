# @package _global_
# MotrixSim manager-based SONIC G1 tracking with the SONIC FastSAC actor.
# Resource scale targets the bundled single-clip smoke store. Full-dataset
# training can restore the release encoder dims and a larger environment/batch
# configuration as a separate experiment.
defaults:
  - /algo_base@algo: motrix.fastsac
  - _self_
task:
  env: g1-sonic
  rllib: motrix
  algo: fastsac
num_envs: 2048
play_num_envs: 16
seed: 1
checkpoint:
  interval: 1000
algo:
  # Encoder and motion-decoder geometry for the SONIC tokenizer. The control
  # decoder is the standard FastSAC actor head below.
  policy_variant: sonic
  variant:
    model:
      num_future_frames: 5 #10
      num_history_frames: 5 #10
      num_tokens: 1 #2
      token_dim: 8 #32
      fsq_levels: 16 #32
      action_dim: 29
      g1_encoder_hidden_dims: [512, 256] #[2048, 1024, 512, 512]
      smpl_encoder_hidden_dims: [512, 256] #[2048, 1024, 512, 512]
      g1_motion_decoder_hidden_dims: [512, 256] #[2048, 1024, 512, 512]
    auxiliary:
      reconstruction: 0.01
      latent_alignment: 1.0
      cycle_consistency: 1.0
  agent:
    # Keep the generic FastSAC contract aligned with g1-wbt-dance. SONIC only
    # owns its policy variant and the resource-constrained batch size below.
    target_entropy_ratio: 0.5
    num_atoms: 501
    gamma: 0.99
    tau: 0.05
    policy_frequency: 2
    num_updates: 4
  trainer:
    num_learning_iterations: 100000
    async_options:
      utd_mode: strict
