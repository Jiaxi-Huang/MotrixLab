# @package _global_
# Task g1-wbt-supermimic: whole-body motion tracking with the APG WM/BPTT
# provider. Iteration granularity matches the upstream supermimic recipe
# exactly: 2.5 env steps per iteration (utd 0.4, alternating 2/3), 10
# world-model window batches, one policy update.
defaults:
  - /algo_base@algo: motrix.apg
  - _self_
task:
  env: g1-wbt-supermimic
  rllib: motrix
  algo: apg
# Local sizing for a 16 GB GPU (RTX 5060 Ti): half the upstream widths and
# a quarter of the env count (upstream: 4096 envs, WM [2048]*3, actor
# [2048,1024,512,256]). The dominant consumer is the replay ring
# (num_envs * capacity * ~1.5k floats/step incl. the 890-dim value obs);
# 512 lanes keeps it ~3 GB. If this still OOMs: actor.batch_size 2048.
num_envs: 512
play_num_envs: 16
seed: 42
logging:
  interval: 100
checkpoint:
  interval: 2000
algo:
  # Upstream convention: the history stack covers the proprioceptive policy
  # group only; these value-group terms feed the actor as one flat current
  # goal window (~0.9 s lookahead) through a single encoder MLP to a tanh
  # latent (upstream's per-task encoders arrive with a second task).
  goal_terms:
    - motion_future_joint
    - motion_future_ref_ori_b
  imagination:
    # The task's one-dim soft-termination term drives the imagination
    # survival gate (upstream: sigmoid((err/threshold - 1) / 0.05)).
    soft_termination_term: soft_termination
  replay:
    # Upstream buffer_steps: 1000 steps per lane.
    capacity: 1000
    # Reference policy-driven replay prefill, also performed after restore.
    warmup_steps: 64
  world_model:
    scheme: floating_base
    hidden: [1024, 1024, 1024]
    # Upstream wm_batch / wm_batches per iteration.
    batch_size: 2048
    batches_per_iteration: 10
  actor:
    # Upstream pi_batch 4096; halved for the 16 GB card — the 32-step eager
    # fp32 BPTT graph is the dominant allocation (batch x horizon x ~75 KB).
    batch_size: 2048
    hidden: [1024, 512, 256, 128]
    # Upstream hist: 10 stacked policy-observation frames.
    history: 10
  trainer:
    # Upstream trains fp32 end to end (TF32 matmuls via
    # float32_matmul_precision("high") are already enabled module-level).
    amp: null
    iterations: 30000
    # Upstream steady-state utd (one update per 2.5 collected steps).
    utd: 0.4
    # Evaluate the full motion library only after training.
    eval_interval: 0
    eval_steps: 500
