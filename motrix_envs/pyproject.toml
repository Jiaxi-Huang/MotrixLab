[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[project]
name = "motrix-envs"
version = "0.4.0"
description = "Robot simulation environment library based on MotrixSim providing multi-task RL environments."
authors = [{ name = "Motphys", email = "developers@motphys.com" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "gymnasium==1.1.1",
    "motrix-env-core[numba,video]==0.4.0",
    "motrix-env-motrixsim==0.4.0",
    "motrix-robots==0.4.0",
    "numpy>=1.26",
    "omegaconf>=2.3,<2.4",
]

[project.entry-points."motrix_env_core.envs"]
builtin = "motrix_envs:register"

[project.entry-points."motrix_deploy.profiles"]
builtin = "motrix_envs.deploy:register"

[project.optional-dependencies]
# Task-side APG parsing heads (*.apg_head modules) need torch for their
# analytic heads and the shared rotation/state-layout math in
# motrix_env_core.torch.geometry; resolved only when a task yaml points an
# APG run at them, so pure simulation installs stay torch-free. The torch
# requirement is owned by motrix-env-core's `torch` extra.
apg = ["motrix-env-core[torch]==0.4.0"]
deploy = ["motrix-deploy==0.4.0", "motrix-deploy-tasks==0.4.0"]
